<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPSS Eğitim Portalı</title>
    <link rel="icon" type="image/jpeg" href="assets/ry_kpss.jpg">
    <link rel="stylesheet" href="style.css"> <style>
        .portal-container {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 80vh; gap: 30px;
        }
        .game-card {
            background: white; border: 2px solid var(--ottoman-purple);
            border-radius: 15px; padding: 20px; width: 320px;
            text-align: center; cursor: pointer; transition: 0.3s;
            text-decoration: none; color: var(--ottoman-purple);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .game-card:hover {
            transform: translateY(-5px); background: var(--ottoman-purple); color: white;
        }
        .game-card h2 { margin: 0 0 10px 0; font-size: 22px; }
        .game-card p { margin: 0; font-size: 13px; opacity: 0.8; }
        .coğrafya-card { border-color: #0077b6; color: #0077b6; }
        .coğrafya-card:hover { background: #0077b6; color: white; }
    </style>
</head>
<body>
    <div class="header" style="margin-top: 50px;">
        <h1>🎯 KPSS Oyun Portalı</h1>
        <p>Hangi dersten başlamak istersin hocam?</p>
    </div>

    <div class="portal-container">
        <a href="tarih/islahatlar.html" class="game-card">
            <div style="font-size: 40px;">📜</div>
            <h2>Islahatlar Fanusu</h2>
            <p>Osmanlı Padişahları ve Islahatları (Tarih)</p>
        </a>

        <a href="cografya/baraj.html" class="game-card coğrafya-card">
            <div style="font-size: 40px;">🌊</div>
            <h2>Akarsu-Baraj Fanusu</h2>
            <p>Akarsular ve Üzerindeki Barajlar (Coğrafya)</p>
        </a>
    </div>
</body>
</html>
